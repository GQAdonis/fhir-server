name: Agent tooling

# Verifies the Claude Code agent team and its Node hooks on all three
# developer platforms: hook tests, committed dist/ freshness, agent lint,
# harness skill mirrors, the .prometheus/ PHI/secret scan, and an exec-form
# hook run (no shell).
on:
  push:
    branches: [main]
    paths:
      - ".claude/**"
      - ".prometheus/**"
      - ".kbd-orchestrator/hooks-config.json"
      - "docs/agent-team.md"
      - ".gitattributes"
      - ".agents/**"
      - ".agent-team/**"
      - ".codex/**"
      - ".opencode/**"
      - ".kimi-code/**"
      - ".minimax/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/agent-team/**"
      - ".github/workflows/agent-tooling.yml"
  pull_request:
    branches: [main]
    paths:
      - ".claude/**"
      - ".prometheus/**"
      - ".kbd-orchestrator/hooks-config.json"
      - "docs/agent-team.md"
      - ".gitattributes"
      - ".agents/**"
      - ".agent-team/**"
      - ".codex/**"
      - ".opencode/**"
      - ".kimi-code/**"
      - ".minimax/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/agent-team/**"
      - ".github/workflows/agent-tooling.yml"

permissions:
  contents: read

concurrency:
  group: agent-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: Hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      AGENT_TEAM_CREATOR: ${{ github.workspace }}/.ci/agent-team-creator-src/dist/plugins/claude/prometheus-skill-pack/skills/agent-team-creator
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # No later step needs git auth, and the job runs third-party code (agent-team-creator).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .claude/hooks/package-lock.json

      - name: Install hook toolchain (TypeScript 7)
        run: npm --prefix .claude/hooks ci

      # check:dist compiles into a temp dir and byte-compares with the committed
      # dist/. It runs before anything that could rebuild dist/, so drift fails.
      - name: Committed dist/ matches src/
        run: npm --prefix .claude/hooks run check:dist

      - name: Hook tests (node:test against dist/)
        run: npm --prefix .claude/hooks test

      # Runs before any third-party code enters the job, so its result cannot be tampered with.
      - name: PHI/secret scan of committable .prometheus/
        run: npm --prefix .claude/hooks run scan:prometheus

      # agent-team-creator (MIT, public) at the commit recorded in
      # .agent-team/team.config.json native.*.version; its compiled CLI has no
      # dependencies. Checked out outside the repo tree's tracked paths.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Prometheus-AGS/prometheus-skill-system
          ref: 5f2d7a712f289b6bb2df3f45138bb3d68ed836a2
          path: .ci/agent-team-creator-src
          sparse-checkout: dist/plugins/claude/prometheus-skill-pack/skills/agent-team-creator
          persist-credentials: false

      # Lints every harness's generated agents and runs the drift checks
      # (build-manifest incl. creator validate, install-exports, gen-agents-md, mirror-skills).
      - name: Lint agent definitions and check drift across harnesses
        run: npm --prefix .claude/hooks run lint:agents

      # .agents/skills/ is the source; the four harness copies must match it.
      # The team scripts' own tests (manifest build, harness install, AGENTS.md).
      - name: Team script tests
        run: node --test scripts/agent-team/build-manifest.test.mjs scripts/agent-team/install-exports.test.mjs scripts/agent-team/gen-agents-md.test.mjs

      - name: Harness skill mirrors match .agents/skills/
        run: node scripts/agent-team/mirror-skills.mjs --check

      # Exec form, as Claude Code runs the hooks: node spawns the compiled
      # module directly with a hook payload on stdin; no shell is involved.
      - name: Exec-form hook run
        run: >-
          node -e "
          const { spawnSync } = require('node:child_process');
          const fs = require('node:fs'); const os = require('node:os'); const path = require('node:path');
          const project = fs.mkdtempSync(path.join(os.tmpdir(), 'hook-exec-'));
          const payload = JSON.stringify({ hook_event_name: 'SubagentStop', agent_type: 'fhir-code-reviewer', agent_id: 'ci', session_id: 'ci-' + process.platform });
          const r = spawnSync(process.execPath, [path.join('.claude', 'hooks', 'dist', 'agent-ledger.mjs')], { input: payload, encoding: 'utf8', env: { ...process.env, CLAUDE_PROJECT_DIR: project } });
          if (r.status !== 0) { console.error(r.stderr); process.exit(1); }
          const lines = fs.readFileSync(path.join(project, '.prometheus', 'agent-ledger.jsonl'), 'utf8').trim().split('\n');
          if (lines.length !== 1 || JSON.parse(lines[0]).event !== 'SubagentStop') { console.error(lines); process.exit(1); }
          console.log('exec-form hook OK on ' + process.platform + ': ' + lines[0]);
          "
