name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-publish.yml'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Restore conformance report
        shell: bash
        run: |
          mkdir -p website/static/docs/conformance/fhir262/app
          if git fetch origin gh-pages; then
            if git cat-file -e origin/gh-pages:docs/conformance/fhir262/app/runs/index.json; then
              git archive origin/gh-pages docs/conformance/fhir262/app | tar -x -C website/static
            elif git cat-file -e origin/gh-pages:fhir262/runs/index.json; then
              mkdir -p /tmp/fhir262-legacy
              git archive origin/gh-pages fhir262 | tar -x -C /tmp/fhir262-legacy
              cp -a /tmp/fhir262-legacy/fhir262/. website/static/docs/conformance/fhir262/app/
            fi
          fi
      - name: Install dependencies
        run: npm ci
        working-directory: website
      - name: Build documentation
        run: npm run build
        working-directory: website
        env:
          DOCUSAURUS_URL: https://${{ github.repository_owner }}.github.io
          DOCUSAURUS_BASE_URL: /${{ github.event.repository.name }}/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/build
