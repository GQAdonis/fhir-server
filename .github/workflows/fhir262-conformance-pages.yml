name: Publish FHIR262 conformance report

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Restore report history
        shell: bash
        run: |
          mkdir -p website/static/docs/conformance/fhir262/app
          if git fetch origin gh-pages; then
            if git cat-file -e origin/gh-pages:docs/conformance/fhir262/app/runs/index.json; then
              git archive origin/gh-pages docs/conformance/fhir262/app | tar -x -C website/static
            elif git cat-file -e origin/gh-pages:fhir262/runs/index.json; then
              mkdir -p /tmp/fhir262-legacy
              git archive origin/gh-pages fhir262 | tar -x -C /tmp/fhir262-legacy
              cp -a /tmp/fhir262-legacy/fhir262/. website/static/docs/conformance/fhir262/app/
            fi
          fi
      - name: Checkout FHIR262 suite
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: prdai-archive/fhir262
          ref: 05e3e7c3703065a2a359dcbd6581bcb9bede62b0
          path: .fhir262
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install FHIR262 dependencies
        run: bun install --frozen-lockfile
        working-directory: .fhir262
      - name: Run publicly accessible FHIR262 conformance suites
        shell: bash
        run: |
          set +e
          make -k test-hapi test-medplum test-msfhir test-fhir-candle test-wso2-fhir-server
          set -e
          for implementation in hapi medplum msfhir fhir-candle wso2-fhir-server; do
            test -s ".results/$implementation.json"
          done
          exit 0
        working-directory: .fhir262
      - name: Build FHIR262 report
        run: |
          mkdir -p dist/runs
          if [ -d ../website/static/docs/conformance/fhir262/app/runs ]; then
            cp -a ../website/static/docs/conformance/fhir262/app/runs/. dist/runs/
          fi
          bun bin/build.ts -results .results -dist dist
        working-directory: .fhir262
      - name: Include report in documentation site
        run: |
          mkdir -p website/static/docs/conformance/fhir262/app
          cp -a .fhir262/dist/. website/static/docs/conformance/fhir262/app/
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install documentation dependencies
        run: npm ci
        working-directory: website
      - name: Build documentation
        run: npm run build
        working-directory: website
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/build
