# >>> agent-team roles (generated by scripts/agent-team/install-exports.mjs from .agent-team/team.json; do not edit) >>>
# Codex reads this project config only after you trust the project in Codex.

[agents.fhir-tech-lead]
description = "Orchestrates the WSO2 FHIR Server agent team through the KBD lifecycle. Use when starting or resuming a KBD phase, deciding which persona should handle a change, running /kbd-execute, /kbd-status, /kbd-goal-check or /kbd-next-phase, or coordinating review and validation before archive; also curates the Karpathy loop at phase end (ledger lessons, knowledge-base outbox and lint, ledger rotation, .prometheus/ scan gate). Delegates instead of editing code. Can run as the main session with `claude --agent fhir-tech-lead`."
config_file = "agents/fhir-tech-lead.toml"

[agents.fhir-architect]
description = "Feature discovery, specification, design and planning for the WSO2 FHIR Server. Use when exploring what to build next, researching FHIR R4 behaviour, Implementation Guides or conformance gaps, turning a vague request into testable phase goals (/kbd-new-phase, /kbd-goal), running /kbd-assess, /kbd-analyze or /kbd-plan, writing OpenSpec proposals, designs, specs and tasks, deciding how a feature fits the storage/search/tenancy architecture, or updating DESIGN.md and docs. Writes only design artifacts (openspec/, docs/, DESIGN.md, KBD stage files), never Go code."
config_file = "agents/fhir-architect.toml"

[agents.fhir-go-developer]
description = "General Go implementation for the WSO2 FHIR Server outside the storage/search core. Use for changes in internal/handler, validate, fhirpath, fhirxml, fhirttl, patch, config, ig, terminology, compartment, obs, cmd/server, and website/docs pages, when a KBD change or OpenSpec task needs code. Works one task at a time via /kbd-apply in an isolated git worktree. Hand store/index/db/searchparam/schema work to fhir-storage-search-engineer."
config_file = "agents/fhir-go-developer.toml"

[agents.fhir-storage-search-engineer]
description = "Storage, search, indexing, schema and tenancy specialist for the WSO2 FHIR Server. Use for any change to internal/store (search.go, bundle.go, integrity.go), internal/index, internal/db (schema.sql), internal/searchparam, row-level security, search parameter behaviour, SQL, query plans, or schema migrations. Enforces fail-closed search and tenant isolation."
config_file = "agents/fhir-storage-search-engineer.toml"

[agents.fhir-test-engineer]
description = "Test engineering for the WSO2 FHIR Server. Use when designing or writing unit tests, testcontainers-based integration tests, race-detector runs, conformance tests, golden snapshots, or benchmarks; when a change needs its test plan; when CI tests fail; or to confirm the StoreAPI mock stays in sync with the store."
config_file = "agents/fhir-test-engineer.toml"

[agents.fhir-code-reviewer]
description = "Read-only diff review for the WSO2 FHIR Server against its conventions, blocking constraints and domain rules. Use after any implementation task or change is done and before archive, or when asked to review a diff, branch or PR. Returns severity-ranked findings (CRITICAL/WARNING/SUGGESTION) and a PASS/BLOCK verdict; never edits files."
config_file = "agents/fhir-code-reviewer.toml"

[agents.fhir-security-compliance-reviewer]
description = "Read-only security and healthcare-compliance review for the WSO2 FHIR Server. Use for any change touching authentication, tenancy or row-level security, SQL construction, error messages, logging or observability, test fixtures, IG/terminology network calls, Helm secrets, or the committed .prometheus/ agent logs. Checks PHI/HIPAA exposure, tenant leakage, injection and secret handling; returns PASS/BLOCK with severity-ranked findings."
config_file = "agents/fhir-security-compliance-reviewer.toml"

[agents.fhir-conformance-validator]
description = "Final archive gate for WSO2 FHIR Server changes. Use after implementation and code/security review, before /opsx:archive or kbd-apply archive, and for /kbd-goal-check. Runs openspec validate, each task's verification, build/vet/test and the CI-parity race-integration suite when store/handler changed, then reports PASS only if everything succeeds. Read-only."
config_file = "agents/fhir-conformance-validator.toml"

[agents.fhir-infra-release-engineer]
description = "CI/CD, deployment and release engineering for the WSO2 FHIR Server. Use for changes to .github/workflows (ci, release, docs-publish, fhir262-conformance-pages, agent-tooling), the Helm chart under helm/, the Dockerfile and docker-compose.yml, GHCR image publishing, release versioning (version.txt), supply-chain hardening of GitHub Actions, or CI failures that are about runners rather than code."
config_file = "agents/fhir-infra-release-engineer.toml"

[agents.hipaa-privacy-officer]
description = "HIPAA privacy and security policy owner for the WSO2 FHIR Server used as an intermediate EHR for AI. Use when a change or integration adds a PHI data flow, a new partner feed or data category, a new model endpoint or PHI destination, or a logging/retention decision; for minimum-necessary assessments, BAA prerequisites, PHI-lane recommendations (ATH-D-001), access and audit control reviews, and breach-assessment steps. Reviews policy; never processes PHI itself."
config_file = "agents/hipaa-privacy-officer.toml"

[agents.fhir-integration-specialist]
description = "FHIR protocol and interoperability specialist for pulling patient data from partner EHRs (Epic, Oracle Health/Cerner, athenahealth, any FHIR R4 server) into this intermediate EHR. Use for FHIR R4 REST and Bulk Data $export design, SMART on FHIR and backend-services authorization, US Core conformance and mapping, patient matching, Provenance, and debugging partner FHIR responses. Sandbox-first; real endpoints only on a Tribe PHI lane."
config_file = "agents/fhir-integration-specialist.toml"

[agents.ehr-integration-manager]
description = "Business owner of partner EHR integrations. Use when onboarding a new partner EHR, tracking integration status, running a go-live checklist, defining or reviewing integration SLAs, coordinating partner contacts and maintenance windows, or managing an integration incident's communication. Works on process and status documents; no PHI and no code."
config_file = "agents/ehr-integration-manager.toml"

[agents.data-sync-coordinator]
description = "Coordinates recurring data synchronization between partner EHRs and this FHIR server. Use when setting or changing a sync schedule, investigating stale or missing data, reconciling partner vs ingested counts after a run, handling a sync failure or partner outage, or writing a sync incident report. Real partner runs only on a Tribe PHI lane."
config_file = "agents/data-sync-coordinator.toml"

[agents.billing-prior-auth-specialist]
description = "Billing, coding and prior-authorization specialist. Use to determine what must be documented in the medical record to bill a procedure for a specific payer, whether prior authorization is required and how to submit it (X12 278, Da Vinci PAS, CMS-0057-F), CPT/HCPCS/ICD-10 linkage and medical necessity, and how to work denials and appeals (CARC/RARC). Cites a source for every payer rule; drafts with real patient details only on a Tribe PHI lane."
config_file = "agents/billing-prior-auth-specialist.toml"
# <<< agent-team roles <<<
