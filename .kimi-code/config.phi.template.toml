# NOT AN APPROVED TRIBE LANE: Kimi Code has no enforceable permission denies,
# so the operator has not approved it for real PHI (docs/compliance/README.md,
# decision 3). Kept as a reference only; do not use it for real PHI.
#
# Template for a Tribe-lane Kimi Code session (change `configure-phi-lanes`).
#
# Kimi Code reads user config from ~/.kimi-code/config.toml (project-level
# config is not supported today: docs/agent-team.md, "Per-harness
# limitations"). Copy the relevant section below into that file; never commit
# a copy with a real endpoint, model name or key. Every value here is a
# TRIBE_MODEL_* environment variable placeholder, per ATH-D-001 and the
# `phi-lane-policy` skill. Verify the exact provider keys against your
# installed Kimi Code version before relying on this file.

[[providers]]
id = "tribe"
name = "Tribe Health Solutions (local, BAA-covered — ATH-D-001)"
# TOML does not interpolate "$VAR" inside string values. Render this template
# with your own tooling, or hand-edit only your untracked
# ~/.kimi-code/config.toml — never this committed template.
base_url = "$TRIBE_MODEL_BASE_URL"
api_key_env = "TRIBE_MODEL_API_KEY"
model = "$TRIBE_MODEL_NAME"

# phi-lane-guard (.claude/hooks/src/phi-lane-guard.mts) proves the lane from
# the process environment, not from this file. Before launching Kimi with
# this provider active, export in your shell (never in a committed file):
#   export PHI_LANE=tribe
#   export TRIBE_MODEL_BASE_URL=<your real Tribe endpoint>
#   export TRIBE_MODEL_API_KEY=<your real Tribe key>
#   export TRIBE_MODEL_NAME=<the model Tribe serves>
#   export AGENT_MODEL_BASE_URL="$TRIBE_MODEL_BASE_URL"
# Declaring PHI_LANE=tribe without a matching AGENT_MODEL_BASE_URL is still
# the synthetic lane (phi-lane-policy): the guard denies non-sandbox FHIR
# pulls either way. Never export these variables for a cloud/non-Tribe model.
# Kimi hooks are also fail-open (docs/agent-team.md): this guard is a
# backstop, not the primary control, on this harness.
